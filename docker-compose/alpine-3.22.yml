services:
  # docker compose run --rm builder-alpine-3.22
  builder-alpine-3.22:
    platform: linux/amd64
    container_name: otx-rt-builder-alpine-3.22
    image: otx-3rd-libs:alpine-3.22
    volumes:
      #- /mnt/i/work/Issues/18990/Cpp/:/otx-rt
      - /mnt/d/Workspace/Products/OpenTestSystem/src/Cpp/:/otx-rt
      - /mnt/d/Workspace/Products/otx4dci/worker-cpp/:/worker-cpp
      - ../.build/alpine-3.22/otx-rt:/build/otx-rt
      - ../.output/alpine-3.22/include/:/build/include
      - ../.output/alpine-3.22/bin/:/build/bin
    working_dir: /build
    command: >
      sh -c '
        echo "============================================================================ " &&
        echo "========================= Creating toolchain.cmake ========================= " &&
        echo "============================================================================ " &&
        echo "set(CMAKE_SYSTEM_NAME alpine)"      >  /toolchain.cmake &&
        echo "set(CMAKE_SYSTEM_PROCESSOR x86_64)" >> /toolchain.cmake &&
        echo "set(CMAKE_C_COMPILER gcc)"          >> /toolchain.cmake &&
        echo "set(CMAKE_CXX_COMPILER g++)"        >> /toolchain.cmake &&
        cat  /toolchain.cmake &&
        echo "============================================================================ " &&
        echo "========================= Building otx-rt ================================== " &&
        echo "============================================================================ " &&
        mkdir -p /build/otx-rt &&
        cd /build/otx-rt &&
        cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=$$BUILD_CXX_STANDARD \
            -DCMAKE_CXX_FLAGS="-Dstat64=stat -Dfstat64=fstat" \
            -DCMAKE_TOOLCHAIN_FILE=/toolchain.cmake \
            -DUSE_DIAGMANAGER=OFF \
            -DOtxDiagManagerSourceDir=/build/otx-diagmanager/lib \
            -DOtxDiagManagerPath=/build/otx-diagmanager/bin \
            -DMCDKERNEL_LIBRARY_DIR=/opt/vw/lib \
            -DRT7_BUILD_STATIC_LIBS=ON \
            -DCPP_BUILD_TYPE="x64" \
            -DRt7InstallDir=/build/otx-rt/binaries/ \
            -DASIO_ROOT=$$ASIO_ROOT \
            -DBOOST_ROOT=$$BOOST_ROOT -DBoost_USE_STATIC_LIBS=ON \
            -DPoco_ROOT=$$POCO_ROOT \
            -Dabsl_DIR=$$ABSEIL_ROOT/lib/cmake/absl \
            -DProtobuf_ROOT=$$PROTOBUF_ROOT \
            -DgRPC_DIR=$$GRPC_ROOT/lib/cmake/grpc \
            -DOPENSSL_ROOT_DIR=$$OPENSSL_ROOT \
            -DLUA_ROOT=$$LUA_ROOT \
            -DXercesC_ROOT=$$XERCESC_ROOT \
            -DXQilla_ROOT=$$XQILLA_ROOT \
            -DRAPIDJSON_ROOT=$$RAPIDJSON_ROOT \
            -DJSONCONS_ROOT=$$JSONCONS_ROOT \
            -DBUILD_EXTERNAL_PROJECT_PATH=/worker-cpp \
            /otx-rt &&
        make help &&
        make OpenTestSystem.Otx.Runtime2.Worker -j8 &&
        cp -a /build/otx-rt/bin/. /build/bin/ &&
        cp -a /build/otx-rt/bin/include/. /build/include/
      '
    stdin_open: true
    tty: true

  # docker compose run --rm builder-alpine-3.22-debug
  # Same as builder-alpine-3.22 but -DCMAKE_BUILD_TYPE=RelWithDebInfo (keeps
  # -O2 optimization -- unlike a full Debug build, which changes timing
  # enough to mask race conditions like the Threading benchmark crash --
  # while adding -g debug symbols so gdb can read a core dump). Uses its own
  # .build/.output dirs (alpine-3.22-debug) so it never clobbers the
  # Release build's binaries; point Dockerfile.alpine-3.22.release's COPY
  # (or --build-arg DEBUG_TOOLS=true build) at
  # .build/alpine-3.22-debug/otx-rt/bin/... to package this one.
  builder-alpine-3.22-debug:
    platform: linux/amd64
    container_name: otx-rt-builder-alpine-3.22-debug
    image: otx-3rd-libs:alpine-3.22
    volumes:
      - /mnt/d/Workspace/Products/OpenTestSystem/src/Cpp/:/otx-rt
      - /mnt/d/Workspace/Products/otx4dci/worker-cpp/:/worker-cpp
      - ../.build/alpine-3.22-debug/otx-rt:/build/otx-rt
      - ../.output/alpine-3.22-debug/include/:/build/include
      - ../.output/alpine-3.22-debug/bin/:/build/bin
    working_dir: /build
    command: >
      sh -c '
        echo "============================================================================ " &&
        echo "========================= Creating toolchain.cmake ========================= " &&
        echo "============================================================================ " &&
        echo "set(CMAKE_SYSTEM_NAME alpine)"      >  /toolchain.cmake &&
        echo "set(CMAKE_SYSTEM_PROCESSOR x86_64)" >> /toolchain.cmake &&
        echo "set(CMAKE_C_COMPILER gcc)"          >> /toolchain.cmake &&
        echo "set(CMAKE_CXX_COMPILER g++)"        >> /toolchain.cmake &&
        cat  /toolchain.cmake &&
        echo "============================================================================ " &&
        echo "========================= Building otx-rt (RelWithDebInfo) ================= " &&
        echo "============================================================================ " &&
        mkdir -p /build/otx-rt &&
        cd /build/otx-rt &&
        cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_STANDARD=$$BUILD_CXX_STANDARD \
            -DCMAKE_CXX_FLAGS="-Dstat64=stat -Dfstat64=fstat" \
            -DCMAKE_TOOLCHAIN_FILE=/toolchain.cmake \
            -DUSE_DIAGMANAGER=OFF \
            -DOtxDiagManagerSourceDir=/build/otx-diagmanager/lib \
            -DOtxDiagManagerPath=/build/otx-diagmanager/bin \
            -DMCDKERNEL_LIBRARY_DIR=/opt/vw/lib \
            -DRT7_BUILD_STATIC_LIBS=ON \
            -DCPP_BUILD_TYPE="x64" \
            -DRt7InstallDir=/build/otx-rt/binaries/ \
            -DASIO_ROOT=$$ASIO_ROOT \
            -DBOOST_ROOT=$$BOOST_ROOT -DBoost_USE_STATIC_LIBS=ON \
            -DPoco_ROOT=$$POCO_ROOT \
            -Dabsl_DIR=$$ABSEIL_ROOT/lib/cmake/absl \
            -DProtobuf_ROOT=$$PROTOBUF_ROOT \
            -DgRPC_DIR=$$GRPC_ROOT/lib/cmake/grpc \
            -DOPENSSL_ROOT_DIR=$$OPENSSL_ROOT \
            -DLUA_ROOT=$$LUA_ROOT \
            -DXercesC_ROOT=$$XERCESC_ROOT \
            -DXQilla_ROOT=$$XQILLA_ROOT \
            -DRAPIDJSON_ROOT=$$RAPIDJSON_ROOT \
            -DJSONCONS_ROOT=$$JSONCONS_ROOT \
            -DBUILD_EXTERNAL_PROJECT_PATH=/worker-cpp \
            /otx-rt &&
        make help &&
        make OpenTestSystem.Otx.Runtime2.Worker -j8 &&
        cp -a /build/otx-rt/bin/. /build/bin/ &&
        cp -a /build/otx-rt/bin/include/. /build/include/
      '
    stdin_open: true
    tty: true