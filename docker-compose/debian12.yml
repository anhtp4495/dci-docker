services:
  # docker compose build builder-debian12
  # docker compose run --rm builder-debian12
  builder-debian12:
    platform: linux/amd64
    container_name: otx-rt-builder-debian12
    image: diagmanager:debian12
    volumes:
      - /mnt/d/Workspace/Products/OtxDiagManager/:/otx-diagmanager
      - /mnt/d/Workspace/Products/OpenTestSystem/src/Cpp/:/otx-rt
      - /otx-diagmanager/src/lib/vwmcd/vwmcd_x86_64
      - ../.build/debian12/otx-diagmanager:/build/otx-diagmanager
      - ../.build/debian12/otx-rt:/build/otx-rt
      - ../.output/debian12/include/:/build/include
      - ../.output/debian12/bin/:/build/bin
    working_dir: /build
    command: >
      sh -c '
        echo "============================================================================ " &&
        echo "========================= enviroment ======================================= " &&
        echo "============================================================================ " &&
        export LD_LIBRARY_PATH=/opt/vw/lib:$$LD_LIBRARY_PATH &&
        echo LD_LIBRARY_PATH=$$LD_LIBRARY_PATH &&
        echo "============================================================================ " &&
        echo "========================= toolchain.cmake ================================== " &&
        echo "============================================================================ " &&
        echo "set(CMAKE_SYSTEM_NAME Linux)"       >  /toolchain.cmake &&
        echo "set(CMAKE_SYSTEM_PROCESSOR x86_64)" >> /toolchain.cmake &&
        echo "set(CMAKE_C_COMPILER gcc)"          >> /toolchain.cmake &&
        echo "set(CMAKE_CXX_COMPILER g++)"        >> /toolchain.cmake &&
        cat  /toolchain.cmake &&
        echo "============================================================================ " &&
        echo "========================= Building otx-diagmanager ========================= " &&
        echo "============================================================================ " &&
        rm -rf /otx-diagmanager/src/lib/vwmcd/vwmcd_x86_64/libmcdkernel.so &&
        ln -s /opt/vw/lib/libmcdkernel.so /otx-diagmanager/src/lib/vwmcd/vwmcd_x86_64/libmcdkernel.so &&
        mkdir -p /build/otx-diagmanager &&
        cd /build/otx-diagmanager &&
        cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=$$BUILD_CXX_STANDARD \
            -DCMAKE_TOOLCHAIN_FILE=/toolchain.cmake \
            -DDIAGMANAGER_BUILD_STATIC_LIBS=ON \
            -DUSE_VWMCD90=OFF \
            -DUSE_VWMCDSP=OFF \
            -DUSE_VWMCD_LINK_LIBRARY=ON \
            -DUSE_DIAGMANAGER_RUNNER=ON \
            -DASIO_ROOT=$$ASIO_ROOT \
            -DBOOST_ROOT=$$BOOST_ROOT -DBoost_USE_STATIC_LIBS=ON \
            -DPoco_ROOT=$$POCO_ROOT \
            -DProtobuf_ROOT=$$PROTOBUF_ROOT \
            -DOPENSSL_ROOT_DIR=$$OPENSSL_ROOT \
            /otx-diagmanager &&
        make -j8 &&
        cp -a /build/otx-diagmanager/bin/. /build/bin/ &&
        cp -a /build/otx-diagmanager/lib/. /build/bin/ &&
        cp -a /build/otx-diagmanager/bin/include/. /build/include/ &&
        echo "============================================================================ " &&
        echo "========================= Building otx-rt ================================== " &&
        echo "============================================================================ " &&
        touch /build/otx-diagmanager/lib/libProtoGenWrapper.a &&
        mkdir -p /build/otx-rt &&
        cd /build/otx-rt &&
        cmake -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=$$BUILD_CXX_STANDARD \
            -DCMAKE_TOOLCHAIN_FILE=/toolchain.cmake \
            -DOtxDiagManagerSourceDir=/build/otx-diagmanager/lib \
            -DOtxDiagManagerPath=/build/otx-diagmanager/bin \
            -DMCDKERNEL_LIBRARY_DIR=/opt/vw/lib \
            -DRT7_BUILD_STATIC_LIBS=ON \
            -DCPP_BUILD_TYPE="x64" \
            -DRt7InstallDir=/build/otx-rt/binaries/ \
            -DASIO_ROOT=$$ASIO_ROOT \
            -DBOOST_ROOT=$$BOOST_ROOT -DBoost_USE_STATIC_LIBS=ON \
            -DPoco_ROOT=$$POCO_ROOT \
            -DProtobuf_ROOT=$$PROTOBUF_ROOT \
            -DOPENSSL_ROOT_DIR=$$OPENSSL_ROOT \
            -DLUA_ROOT=$$LUA_ROOT \
            -DXercesC_ROOT=$$XERCESC_ROOT \
            -DXQilla_ROOT=$$XQILLA_ROOT \
            -DRAPIDJSON_ROOT=$$RAPIDJSON_ROOT \
            -DJSONCONS_ROOT=$$JSONCONS_ROOT \
            /otx-rt &&
        make -j8 &&
        cp -a /build/otx-rt/bin/. /build/bin/ &&
        cp -a /build/otx-rt/bin/include/. /build/include/
      '
    stdin_open: true
    tty: true